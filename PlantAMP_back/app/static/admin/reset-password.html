<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nova senha · PlantAMP Admin</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="auth">
  <main class="card">
    <div class="brand"><span class="logo" aria-hidden="true"></span>PlantAMP <span class="tag">Admin</span></div>
    <h1>Criar nova senha</h1>
    <p class="sub">Ao salvar, todas as sessões abertas da sua conta serão encerradas.</p>

    <p class="msg error" id="no-token" hidden>Link incompleto. Abra novamente o link recebido por e-mail ou peça um novo.</p>

    <form id="reset-form" novalidate>
      <label>Nova senha <span class="hint">mínimo 10 caracteres, com letras e números</span>
        <input type="password" name="new_password" autocomplete="new-password" required minlength="10">
      </label>
      <label>Repita a nova senha
        <input type="password" name="confirm" autocomplete="new-password" required>
      </label>
      <p class="msg" id="msg" role="alert" hidden></p>
      <button type="submit">Salvar nova senha</button>
    </form>

    <nav class="links">
      <a href="/admin/login">Voltar ao login</a>
      <a href="/admin/forgot-password">Pedir novo link</a>
    </nav>
  </main>
  <script src="/admin/assets/common.js"></script>
  <script src="/admin/assets/reset.js"></script>
</body>
</html>
