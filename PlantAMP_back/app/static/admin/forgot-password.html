<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Esqueci minha senha · PlantAMP Admin</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="auth">
  <main class="card">
    <div class="brand"><span class="logo" aria-hidden="true"></span>PlantAMP <span class="tag">Admin</span></div>
    <h1>Esqueci minha senha</h1>
    <p class="sub">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link de uso único para criar uma nova senha.</p>

    <form id="forgot-form" novalidate>
      <label>E-mail
        <input type="email" name="email" autocomplete="username" required autofocus>
      </label>
      <p class="msg" id="msg" role="status" hidden></p>
      <button type="submit">Enviar link</button>
    </form>

    <nav class="links">
      <a href="/admin/login">Voltar ao login</a>
      <a href="/admin/recovery">Sem acesso ao e-mail? Use um código</a>
    </nav>
  </main>
  <script src="/admin/assets/common.js"></script>
  <script src="/admin/assets/forgot.js"></script>
</body>
</html>
