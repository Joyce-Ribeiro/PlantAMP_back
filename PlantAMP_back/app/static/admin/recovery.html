<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Código de recuperação · PlantAMP Admin</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="auth">
  <main class="card">
    <div class="brand"><span class="logo" aria-hidden="true"></span>PlantAMP <span class="tag">Admin</span></div>
    <h1>Usar código de recuperação</h1>
    <p class="sub">Use um dos códigos que você guardou ao gerá-los no painel. Cada código funciona uma única vez.</p>

    <form id="recovery-form" novalidate>
      <label>E-mail
        <input type="email" name="email" autocomplete="username" required autofocus>
      </label>
      <label>Código de recuperação
        <input type="text" name="recovery_code" class="mono" placeholder="XXXX-XXXX-XXXX-XXXX"
               autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required>
      </label>
      <label>Nova senha <span class="hint">mínimo 10 caracteres, com letras e números</span>
        <input type="password" name="new_password" autocomplete="new-password" required minlength="10">
      </label>
      <label>Repita a nova senha
        <input type="password" name="confirm" autocomplete="new-password" required>
      </label>
      <p class="msg" id="msg" role="alert" hidden></p>
      <button type="submit">Redefinir senha</button>
    </form>

    <nav class="links">
      <a href="/admin/login">Voltar ao login</a>
      <a href="/admin/forgot-password">Receber link por e-mail</a>
    </nav>
  </main>
  <script src="/admin/assets/common.js"></script>
  <script src="/admin/assets/recovery.js"></script>
</body>
</html>
